version: 1
residents:
  - id: example
    display_name: Example Client
    memory_namespace: example
    identity_prompt: Generic example client with no private identity.
    default_memory_route: local_example
    memory_routes:
      - id: local_example
        storage: local
        source: example-placeholder
        context_model: none
      - id: public_example
        storage: vps
        source: public-app-placeholder
        context_model: none
    model_families: []
    mcp_routes:
      - id: example_app
        write_memory_route: public_example
        read_memory_routes:
          - public_example
